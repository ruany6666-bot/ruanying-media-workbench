name: Ruanying Daily Discovery
on:
  workflow_dispatch:
  schedule:
    # Beijing 09:00 daily (GitHub may queue scheduled runs).
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths: ["scripts/collector.py", ".github/workflows/main.yml"]
permissions:
  contents: read
concurrency:
  group: ruanying-daily-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests==2.32.5 feedparser==6.0.12 beautifulsoup4==4.14.3
      - name: Run Ruanying discovery collector
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_ENDPOINT: https://zanfbtpuflmmxjnfczzr.supabase.co/functions/v1/ingest-viral-cases
        run: python scripts/collector.py
      - name: Save discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-evidence
          path: reports/discovery.json
          if-no-files-found: warn
          retention-days: 14
