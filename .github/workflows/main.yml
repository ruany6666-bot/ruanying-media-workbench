name: Ruanying Daily Discovery

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run Ruanying discovery collector
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_ENDPOINT: https://zanfbtpuflmmxjnfczzr.supabase.co/functions/v1/ingest-viral-cases
        run: python scripts/collector.py
